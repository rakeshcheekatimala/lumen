openapi: 3.0.0
info:
  title: API Gateway
  version: 1.0.0
  description: >
    Entry point for the payment platform. Routes requests to payment-service
    and order-service. Handles auth validation and rate limiting.
  contact:
    team: platform-eng
servers:
  - url: http://api-gateway:3000
    description: Internal cluster DNS

x-dependencies:
  - service: payment-service
    url: http://payment-service:8080
    protocol: http
  - service: order-service
    url: http://order-service:8085
    protocol: http

paths:
  /health:
    get:
      summary: Health check
      operationId: health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/payments:
    post:
      summary: Initiate a payment
      operationId: createPayment
      description: Proxies to payment-service /payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Payment initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/v1/payments/{paymentId}:
    get:
      summary: Get payment status
      operationId: getPayment
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/orders:
    post:
      summary: Create an order
      operationId: createOrder
      description: Proxies to order-service /orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/orders/{orderId}:
    get:
      summary: Get order details
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    PaymentRequest:
      type: object
      required: [amount, currency, customer_id, card_token]
      properties:
        amount:
          type: number
          format: double
          minimum: 0.01
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: USD
        customer_id:
          type: string
          format: uuid
        card_token:
          type: string
          description: Tokenized card reference from card vault
        idempotency_key:
          type: string
          description: Client-generated UUID for dedup

    PaymentResponse:
      type: object
      properties:
        payment_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, approved, declined, fraud_hold]
        amount:
          type: number
        currency:
          type: string
        created_at:
          type: string
          format: date-time

    OrderRequest:
      type: object
      required: [customer_id, items]
      properties:
        customer_id:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        shipping_address:
          $ref: '#/components/schemas/Address'

    OrderItem:
      type: object
      required: [sku, quantity]
      properties:
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_price:
          type: number

    OrderResponse:
      type: object
      properties:
        order_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [created, confirmed, processing, shipped, delivered, cancelled]
        total_amount:
          type: number
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        created_at:
          type: string
          format: date-time

    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        country:
          type: string
          pattern: '^[A-Z]{2}$'
        postal_code:
          type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        upstreams:
          type: object
          additionalProperties:
            type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    UpstreamError:
      description: Upstream service error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              upstream:
                type: string
