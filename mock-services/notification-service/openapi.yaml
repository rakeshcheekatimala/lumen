openapi: 3.0.0
info:
  title: Notification Service
  version: 1.0.0
  description: >
    Consumes payment-events from Kafka and dispatches email/SMS notifications.
    Also exposes a direct API for immediate notifications from other services.
  contact:
    team: platform-eng
servers:
  - url: http://notification-service:8083
    description: Internal cluster DNS

x-dependencies:
  - service: kafka
    url: kafka:9092
    protocol: kafka
    topic: payment-events
    role: consumer
    group_id: notification-group

paths:
  /health:
    get:
      summary: Health check
      operationId: health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /notify:
    post:
      summary: Send an immediate notification
      operationId: sendNotification
      description: Direct API for synchronous notification dispatch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      responses:
        '202':
          description: Notification queued for delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReceipt'
        '400':
          description: Invalid request

  /notify/batch:
    post:
      summary: Send notifications to multiple recipients
      operationId: sendBatchNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notifications]
              properties:
                notifications:
                  type: array
                  maxItems: 500
                  items:
                    $ref: '#/components/schemas/NotificationRequest'
      responses:
        '202':
          description: Batch queued

  /notifications/{notificationId}:
    get:
      summary: Get delivery status
      operationId: getNotification
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationStatus'
        '404':
          description: Not found

  /preferences/{customerId}:
    get:
      summary: Get customer notification preferences
      operationId: getPreferences
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'

    put:
      summary: Update customer notification preferences
      operationId: updatePreferences
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferences'
      responses:
        '200':
          description: Preferences updated

  /stats:
    get:
      summary: Delivery statistics
      operationId: getStats
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: channel
          in: query
          schema:
            type: string
            enum: [email, sms, push]
      responses:
        '200':
          description: Delivery stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryStats'

components:
  schemas:
    NotificationRequest:
      type: object
      required: [recipient_id, channel, template_id]
      properties:
        recipient_id:
          type: string
          format: uuid
        channel:
          type: string
          enum: [email, sms, push]
        template_id:
          type: string
          enum: [payment_approved, payment_declined, payment_refunded, order_shipped, order_delivered]
        template_vars:
          type: object
          additionalProperties:
            type: string
          description: Variables injected into notification template
        idempotency_key:
          type: string

    NotificationReceipt:
      type: object
      properties:
        notification_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, sent, failed]

    NotificationStatus:
      type: object
      properties:
        notification_id:
          type: string
          format: uuid
        recipient_id:
          type: string
          format: uuid
        channel:
          type: string
        template_id:
          type: string
        status:
          type: string
          enum: [queued, sent, delivered, failed, bounced]
        sent_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time

    NotificationPreferences:
      type: object
      properties:
        email_enabled:
          type: boolean
          default: true
        sms_enabled:
          type: boolean
          default: false
        push_enabled:
          type: boolean
          default: true
        email_address:
          type: string
          format: email
        phone_number:
          type: string
        quiet_hours_start:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        quiet_hours_end:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'

    DeliveryStats:
      type: object
      properties:
        total_sent:
          type: integer
        delivery_rate:
          type: number
        bounce_rate:
          type: number
        by_channel:
          type: object
          additionalProperties:
            type: object
            properties:
              sent:
                type: integer
              delivered:
                type: integer
              failed:
                type: integer

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        kafka_consumer:
          type: string
        lag:
          type: integer
          description: Kafka consumer lag
